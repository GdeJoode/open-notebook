# model_routing.yaml
# Model routing configuration — determines which LLM/provider to use
# based on privacy level and pipeline step.
#
# Privacy levels:
#   public    — document may be sent to cloud APIs (faster, better quality)
#   internal  — only local models, data stays on-premise
#   confidential — local only, minimal logging
#
# Each pipeline step has a routing per privacy level.
# "any" means the same provider is used regardless of privacy.
#
# Override per request via model_override in the API payload.

defaults:
  # Default privacy when not specified
  default_privacy: "internal"

providers:
  ollama:
    type: "ollama"
    base_url: "${OLLAMA_URL:-http://localhost:11434}"
    # No API key needed

  nvidia:
    type: "openai_compatible"
    base_url: "${NVIDIA_API_URL:-https://integrate.api.nvidia.com/v1}"
    api_key: "${NVIDIA_API_KEY}"
    # Free tier: Mistral Large 3 675B

routing:
  # --- Extraction (entity/relation extraction from text) ---
  extraction:
    public:
      provider: "nvidia"
      model: "mistralai/mistral-large-3-675b-instruct-2512"
      temperature: 0.1
      max_tokens: 4096
    internal:
      provider: "ollama"
      model: "llama3.1:8b-instruct-q4_0"
      temperature: 0.1
      max_tokens: 4096
      num_ctx: 8192
    confidential:
      provider: "ollama"
      model: "llama3.1:8b-instruct-q4_0"
      temperature: 0.1
      max_tokens: 4096
      num_ctx: 8192

  # --- Summarization ---
  summarization:
    public:
      provider: "nvidia"
      model: "mistralai/mistral-large-3-675b-instruct-2512"
      temperature: 0.1
      max_tokens: 4096
    internal:
      provider: "ollama"
      model: "llama3.1:8b-instruct-q4_0"
      temperature: 0.1
      max_tokens: 4096
      num_ctx: 32768
    confidential:
      provider: "ollama"
      model: "llama3.1:8b-instruct-q4_0"
      temperature: 0.1
      max_tokens: 4096
      num_ctx: 32768

  # --- Embedding (always local — vectors don't need cloud) ---
  embedding:
    any:
      provider: "ollama"
      model: "mxbai-embed-large"

  # --- Transcription (always local — WhisperX on GPU) ---
  transcription:
    any:
      provider: "whisperx"
      model: "large-v3"
      device: "cuda"

  # --- Document parsing (always local — Docling on GPU) ---
  parsing:
    any:
      provider: "docling"
      device: "cuda"

  # --- VLM / handwriting (local GPU for docling, cloud possible) ---
  vlm:
    public:
      provider: "nvidia"
      model: "meta/llama-4-maverick-17b-128e-instruct"
    internal:
      provider: "ollama"
      model: "granite3.2-vision"
    confidential:
      provider: "ollama"
      model: "granite3.2-vision"
