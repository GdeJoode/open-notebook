[project]
name = "entity-filtering"
version = "0.1.0"
description = "Generic entity/relation filtering, deduplication, and scoring pipeline"
requires-python = ">=3.10"
dependencies = [
    "shared",
    "surrealdb-service",
    "semantic-intelligence",
    "networkx>=3.0",
    "loguru>=0.7.2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
embeddings = ["numpy>=1.24.0"]
fuzzy = ["jellyfish>=1.0.0"]
faiss = ["numpy>=1.24.0", "faiss-cpu>=1.7.0"]
semantic = ["numpy>=1.24.0", "hdbscan>=0.8.33", "umap-learn>=0.5.4", "rapidfuzz>=3.0.0"]
ontology = ["ontology-manager"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "pytest-cov>=4.0.0"]

[project.scripts]
entity-filtering = "entity_filtering.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entity_filtering"]

[tool.uv.sources]
shared = { workspace = true }
surrealdb-service = { workspace = true }
ontology-manager = { workspace = true }
semantic-intelligence = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
