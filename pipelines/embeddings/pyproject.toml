[project]
name = "embeddings"
version = "0.1.0"
description = "Embedding generation and vector management pipeline"
requires-python = ">=3.10"
dependencies = [
    "shared",
    "surrealdb-service",
    "llm-manager",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30.0"]
local = ["sentence-transformers>=2.2.0"]
onnx = ["onnxruntime>=1.16.0"]

[project.scripts]
embeddings = "embeddings.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embeddings"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.uv.sources]
shared = { workspace = true }
surrealdb-service = { workspace = true }
llm-manager = { workspace = true }
