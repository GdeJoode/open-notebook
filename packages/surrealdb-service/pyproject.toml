[project]
name = "surrealdb-service"
version = "0.1.0"
description = "SurrealDB service layer with REST API and MCP server"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "surrealdb>=1.0.4",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30.0"]

[project.scripts]
surrealdb-service = "surrealdb_service.api.app:main"
surrealdb-mcp = "surrealdb_service.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/surrealdb_service"]

[tool.uv.sources]
shared = { workspace = true }
