# werkbak-toegang (ADR 0016): alleen naar open-notebook. /api en /health naar de
# API (5055), de rest naar de interface (8502). Geen andere bestemming.
server {
    listen 8080;
    client_max_body_size 200m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 600s;

    location /api/ {
        proxy_pass http://open-notebook:5055;
    }
    location = /health {
        proxy_pass http://open-notebook:5055;
    }
    location / {
        proxy_pass http://open-notebook:8502;
    }
}
