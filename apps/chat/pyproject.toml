[project]
name = "chat"
version = "0.1.0"
description = "Chat application - RAG-powered knowledge base chat interface"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "surrealdb-service",
    "llm-manager",
    "retrieval",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sse-starlette>=1.6.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30.0"]

[project.scripts]
chat = "chat.api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat"]

[tool.uv.sources]
shared = { workspace = true }
surrealdb-service = { workspace = true }
llm-manager = { workspace = true }
retrieval = { workspace = true }
