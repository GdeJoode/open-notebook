[project]
name = "web-scraper"
version = "0.1.0"
description = "Web scraping pipeline for content acquisition"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "file-manager",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.40.0",
    "readability-lxml>=0.8.1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30.0"]

[project.scripts]
web-scraper = "web_scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_scraper"]

[tool.uv.sources]
shared = { workspace = true }
file-manager = { workspace = true }
