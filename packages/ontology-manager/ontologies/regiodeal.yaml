# regiodeal.yaml
# Ontologie Regionaal Beleid Nederland
# Voor Regio Deals, brede welvaart, regionale ontwikkeling documenten
#
# v2.0.0 — Uitgebreid op basis van extractie-analyse uit 3 convenanten:
#   - Personen opgesplitst (Bewindspersoon, Bestuurder, Ambtenaar)
#   - Beleidsinstrumenten verfijnd (Akkoord, Regeling, Programma, Wet)
#   - BeleidsPijler en BeleidsThema toegevoegd
#   - Project en Voorziening toegevoegd
#   - Internationaal toegevoegd (Land, BuitenlandseRegio)
#   - graph_relevance per type: "active" = graaf-node, "contextual" = metadata

metadata:
  name: "regiodeal"
  version: "2.0.0"
  description: "Ontologie voor Nederlands regionaal beleid, Regio Deals en brede welvaart"
  extends: "policy"
  namespaces:
    schema: "https://schema.org/"
    dc: "http://purl.org/dc/elements/1.1/"

# =============================================================================
# ENTITY TYPES
# =============================================================================

entity_types:
  # ---------------------------------------------------------------------------
  # Geografische entiteiten (graph_relevance: active)
  # ---------------------------------------------------------------------------
  - name: "Gemeente"
    description: "Nederlandse gemeente als bestuurlijke eenheid"
    parent_type: "AdministrativeArea"
    graph_relevance: "active"
    extraction_hints:
      - "Gemeente, gemeenten, plaatsnamen"
      - "Bestuurlijke eenheid op lokaal niveau"
      - "NIET: personen, wethouders, burgemeesters"
    properties:
      - name: "name"
        data_type: "string"
        required: true
      - name: "provincie"
        data_type: "reference"
        reference_type: "Provincie"

  - name: "Provincie"
    description: "Nederlandse provincie"
    parent_type: "AdministrativeArea"
    graph_relevance: "active"
    extraction_hints:
      - "Een van de 12 provincies: Groningen, Fryslân, Drenthe, Overijssel, Flevoland, Gelderland, Utrecht, Noord-Holland, Zuid-Holland, Zeeland, Noord-Brabant, Limburg"

  - name: "FunctioneleRegio"
    description: "Samenwerkingsgebied of economische regio (niet-bestuurlijk)"
    parent_type: "Place"
    graph_relevance: "active"
    extraction_hints:
      - "Parkstad, Achterhoek, Foodvalley, Brainport, Economic Board regio's"
      - "Arbeidsmarktregio, COROP-gebied"
      - "NIET: thema's, pijlers, activiteiten, of generieke termen als 'regio'"

  - name: "Wijk"
    description: "Subgemeentelijk niveau: wijk, buurt, kern, dorp, stadsdeel"
    parent_type: "Place"
    graph_relevance: "active"
    extraction_hints:
      - "Wijknamen, buurten, kernen, dorpen binnen een gemeente"
      - "Sneek, Joure, Bolsward, Lemmer als kernen binnen een gemeente"

  - name: "Grensregio"
    description: "Gebied aan landsgrens, vaak grensoverschrijdend"
    parent_type: "Place"
    graph_relevance: "active"
    extraction_hints:
      - "Euregio, grensregio, grensoverschrijdend gebied"
      - "NIET: buitenlandse regio's zelf — gebruik daarvoor BuitenlandseRegio"

  # ---------------------------------------------------------------------------
  # Internationaal (graph_relevance: active)
  # ---------------------------------------------------------------------------
  - name: "Land"
    description: "Land of staat (buitenland)"
    parent_type: "Place"
    graph_relevance: "active"
    extraction_hints:
      - "Duitsland, België, landen buiten Nederland"
      - "NIET: Nederland zelf (dat is de impliciete context)"

  - name: "BuitenlandseRegio"
    description: "Regio in het buitenland, relevant voor grensoverschrijdende samenwerking"
    parent_type: "Place"
    graph_relevance: "active"
    extraction_hints:
      - "Nedersaksen, Nordrhein-Westfalen, Vlaanderen"
      - "Buitenlandse deelstaten, provincies, regio's"

  - name: "InternationaleOrganisatie"
    description: "Internationale of supranationale organisatie"
    parent_type: "Organization"
    graph_relevance: "active"
    extraction_hints:
      - "Europese Unie, EU, VN, OESO/OECD, Raad van Europa"

  # ---------------------------------------------------------------------------
  # Organisaties en actoren (graph_relevance: active)
  # ---------------------------------------------------------------------------
  - name: "Ministerie"
    description: "Nederlands ministerie of directoraat"
    parent_type: "GovernmentOrganization"
    graph_relevance: "active"
    extraction_hints:
      - "Ministerie van BZK, EZK, VWS, LNV, I&W, etc."
      - "Gebruik de officiele naam OF de gangbare afkorting"
      - "NIET: personen (ministers, staatssecretarissen)"
    aliases:
      BZK: "Ministerie van Binnenlandse Zaken en Koninkrijksrelaties"
      EZK: "Ministerie van Economische Zaken en Klimaat"
      EZ: "Ministerie van Economische Zaken"
      LNV: "Ministerie van Landbouw, Natuur en Voedselkwaliteit"
      LVVN: "Ministerie van Landbouw, Visserij, Voedselzekerheid en Natuur"
      VWS: "Ministerie van Volksgezondheid, Welzijn en Sport"
      OCW: "Ministerie van Onderwijs, Cultuur en Wetenschap"
      SZW: "Ministerie van Sociale Zaken en Werkgelegenheid"
      IenW: "Ministerie van Infrastructuur en Waterstaat"
      JenV: "Ministerie van Justitie en Veiligheid"
      VRO: "Ministerie van Volkshuisvesting en Ruimtelijke Ordening"
      KGG: "Ministerie van Klimaat en Groene Groei"
      Fin: "Ministerie van Financiën"
      Def: "Ministerie van Defensie"

  - name: "Uitvoeringsorganisatie"
    description: "Rijksuitvoeringsorganisatie of ZBO"
    parent_type: "GovernmentOrganization"
    graph_relevance: "active"
    extraction_hints:
      - "RVO, Rijkswaterstaat, DUO, UWV, SVB, CBS, RIVM"

  - name: "Kennisinstelling"
    description: "Adviesraad, planbureau of kennisinstelling"
    parent_type: "Organization"
    graph_relevance: "active"
    extraction_hints:
      - "PBL, SCP, CPB, RIVM, CBS"
      - "Rli, ROB, SER, WRR, adviesraden"

  - name: "Onderwijsinstelling"
    description: "School, ROC, hogeschool of universiteit"
    parent_type: "EducationalOrganization"
    graph_relevance: "active"
    extraction_hints:
      - "MBO, HBO, WO, ROC, universiteit, hogeschool"

  - name: "Zorginstelling"
    description: "Ziekenhuis, GGD, thuiszorgorganisatie"
    parent_type: "Organization"
    graph_relevance: "active"
    extraction_hints:
      - "Ziekenhuis, huisarts, GGD, GGZ, thuiszorg"

  - name: "Woningcorporatie"
    description: "Woningcorporatie of woningbouwvereniging"
    parent_type: "Organization"
    graph_relevance: "active"
    extraction_hints:
      - "Woningcorporatie, woningbouwvereniging"
      - "NIET: het woord 'woningcorporatie' als generieke term"

  - name: "EconomicBoard"
    description: "Regionale economische samenwerkingsorganisatie"
    parent_type: "Organization"
    graph_relevance: "active"
    extraction_hints:
      - "Economic Board, triple helix, regionale ontwikkelingsmaatschappij"
      - "Innovatiepact, Toerisme Alliantie"

  # ---------------------------------------------------------------------------
  # Personen (graph_relevance: contextual — metadata, niet als graaf-node)
  # ---------------------------------------------------------------------------
  - name: "Bewindspersoon"
    description: "Minister of staatssecretaris"
    parent_type: "Person"
    graph_relevance: "contextual"
    extraction_hints:
      - "Minister van ..., staatssecretaris van ..."
      - "Personen met titels als minister, staatssecretaris"
      - "Voorbeelden: Hugo de Jonge, Tamara van Ark, K.H. Ollongren"

  - name: "Bestuurder"
    description: "Wethouder, burgemeester, gedeputeerde, commissaris van de Koning"
    parent_type: "Person"
    graph_relevance: "contextual"
    extraction_hints:
      - "Wethouder, burgemeester, gedeputeerde, commissaris"
      - "Personen die namens gemeente of provincie tekenen"

  - name: "Ambtenaar"
    description: "Rijksambtenaar, gemeenteambtenaar, programmadirecteur"
    parent_type: "Person"
    graph_relevance: "contextual"
    extraction_hints:
      - "Directeur, programmaleider, secretaris, coördinator"
      - "Alleen als de persoon bij naam wordt genoemd"

  # ---------------------------------------------------------------------------
  # Beleidsinstrumenten (graph_relevance: active)
  # ---------------------------------------------------------------------------
  - name: "RegioDeal"
    description: "Regio Deal tussen Rijk en regio voor regionale ontwikkeling"
    parent_type: "GovernmentService"
    graph_relevance: "active"
    extraction_hints:
      - "Regio Deal, Regiodeal, convenant regio deal"
      - "Tranche 1/2/3/4/5"
    properties:
      - name: "name"
        data_type: "string"
        required: true
      - name: "regio"
        data_type: "reference"
        reference_type: "FunctioneleRegio"
      - name: "tranche"
        data_type: "string"
      - name: "rijksbijdrage"
        data_type: "float"
      - name: "regiobijdrage"
        data_type: "float"
      - name: "looptijd"
        data_type: "string"

  - name: "Akkoord"
    description: "Bestuurlijk akkoord of convenant tussen overheden/partijen"
    parent_type: "GovernmentService"
    graph_relevance: "active"
    extraction_hints:
      - "GALA, IZA, Preventieakkoord, Klimaatakkoord, Coalitieakkoord"
      - "Bestuursakkoord, convenant, intentieverklaring"

  - name: "Regeling"
    description: "Subsidieregeling, uitkering, of financieringsinstrument"
    parent_type: "GovernmentService"
    graph_relevance: "active"
    extraction_hints:
      - "Regeling, specifieke uitkering, SPUK, JTF"
      - "Subsidie, fonds, financieringsinstrument"

  - name: "BeleidsProgramma"
    description: "Meerjarig beleidsprogramma van Rijk, provincie of gemeente"
    parent_type: "GovernmentService"
    graph_relevance: "active"
    extraction_hints:
      - "Nationaal Programma, NPVR, NPLV, Programma ..."
      - "Actieplan, uitvoeringsprogramma, agenda"
      - "NIET: generieke termen als 'programma' of 'beleid'"

  - name: "Wet"
    description: "Wet of wetswijziging"
    parent_type: "GovernmentService"
    graph_relevance: "active"
    extraction_hints:
      - "Omgevingswet, Woningwet, Wet gemeentelijke taken"

  - name: "CityDeal"
    description: "City Deal samenwerkingsverband tussen steden en Rijk"
    parent_type: "GovernmentService"
    graph_relevance: "active"
    extraction_hints:
      - "City Deal, Agenda Stad, stedelijke samenwerking"

  - name: "Woondeal"
    description: "Woondeal voor woningbouwafspraken"
    parent_type: "GovernmentService"
    graph_relevance: "active"
    extraction_hints:
      - "Woondeal, woningbouwafspraken"

  # ---------------------------------------------------------------------------
  # Thema's en pijlers (graph_relevance: active — belangrijk voor BW analyse)
  # ---------------------------------------------------------------------------
  - name: "BeleidsThema"
    description: "Overkoepelend beleidsthema (brede welvaart, leefbaarheid, etc.)"
    parent_type: "Concept"
    graph_relevance: "active"
    extraction_hints:
      - "Brede welvaart thema's: gezondheid, werkgelegenheid, leefbaarheid"
      - "Vergrijzing, ontgroening, bevolkingskrimp, bereikbaarheid"
      - "Bestaanszekerheid, kansenongelijkheid, woningmarkt"
      - "Alleen herkenbare, benoemde thema's — geen beschrijvende zinnen"

  - name: "BeleidsPijler"
    description: "Pijler of speerpunt binnen een specifiek programma of regio deal"
    parent_type: "Concept"
    graph_relevance: "active"
    extraction_hints:
      - "De pijlers/speerpunten van een regio deal"
      - "Bijv: 'Leren', 'Werk en Inkomen', 'Gezondheid', 'Woonomgeving'"
      - "Alleen als het expliciet als pijler of speerpunt wordt benoemd"

  # ---------------------------------------------------------------------------
  # Projecten en initiatieven (graph_relevance: active)
  # ---------------------------------------------------------------------------
  - name: "Project"
    description: "Concreet project of initiatief binnen een programma of regio deal"
    parent_type: "CreativeWork"
    graph_relevance: "active"
    extraction_hints:
      - "Specifiek benoemd project, pilot, initiatief"
      - "Bijv: 'Gezonde Huiskamer', 'Dutch TechZone', 'Greenwise Campus'"
      - "NIET: generieke activiteiten of beschrijvingen"

  - name: "Voorziening"
    description: "Fysieke voorziening, locatie, of faciliteit"
    parent_type: "Place"
    graph_relevance: "active"
    extraction_hints:
      - "Campus, hub, centrum, ontmoetingsplek, buurthuis"
      - "Alleen als het een benoemde voorziening is"

# =============================================================================
# CONCEPTS - Brede Welvaart
# =============================================================================

concepts:
  - name: "BredeWelvaart"
    description: "Overkoepelend concept voor kwaliteit van leven in brede zin"
    related_concepts:
      - "MaterieleWelvaart"
      - "Gezondheid"
      - "WonenLeefomgeving"
      - "ArbeidVrijeTijd"
      - "OnderwijsOntwikkeling"
      - "SocialeVerbondenheid"
      - "VertrouwenInstituties"
      - "Veiligheid"

  - name: "MaterieleWelvaart"
    description: "Inkomen, vermogen, werk, koopkracht"
    indicators:
      - "inkomen per hoofd"
      - "werkloosheidspercentage"
      - "armoede"
      - "schulden"

  - name: "Gezondheid"
    description: "Levensverwachting, ziekte, leefstijl, zorggebruik"
    indicators:
      - "levensverwachting"
      - "gezonde levensjaren"
      - "overgewicht"

  - name: "WonenLeefomgeving"
    description: "Woningkwaliteit, woonomgeving, groen, veiligheid"
    indicators:
      - "woningtekort"
      - "woontevredenheid"
      - "afstand tot groen"

  - name: "Vergrijzing"
    description: "Toename aandeel ouderen in de bevolking"
    related_concepts:
      - "Ontgroening"
      - "BevolkingsDaling"
    causal_patterns:
      - "Vergrijzing leidt tot minder draagvlak voor voorzieningen"
      - "Vertrek jongeren versterkt vergrijzing"

  - name: "BevolkingsDaling"
    description: "Structurele afname van bevolkingsomvang (krimp)"
    related_concepts:
      - "Vergrijzing"
      - "Leegstand"
    causal_patterns:
      - "Krimp leidt tot verschraling voorzieningen"
      - "Krimp veroorzaakt leegstand"

  - name: "VoorzieningenNiveau"
    description: "Beschikbaarheid en bereikbaarheid van voorzieningen"
    indicators:
      - "afstand tot huisarts"
      - "afstand tot basisschool"
      - "OV-bereikbaarheid"

  - name: "Leefbaarheid"
    description: "Kwaliteit van woon- en leefomgeving"
    related_concepts:
      - "WonenLeefomgeving"
      - "Veiligheid"
      - "VoorzieningenNiveau"

  - name: "Vitaliteit"
    description: "Veerkracht en toekomstbestendigheid van een gebied"

  - name: "SocialeInnovatie"
    description: "Nieuwe vormen van samenwerking en maatschappelijke oplossingen"

# =============================================================================
# RELATIONSHIP TYPES
# =============================================================================

relationship_types:
  # Structurele relaties
  - name: "ONDERDEEL_VAN"
    description: "Deel-geheel relatie (gemeente in provincie, project in programma)"
    source_types: ["Gemeente", "FunctioneleRegio", "Wijk", "BeleidsPijler", "Project"]
    target_types: ["Provincie", "FunctioneleRegio", "Gemeente", "RegioDeal", "BeleidsProgramma"]

  - name: "SAMENWERKING_MET"
    description: "Partnerschap of samenwerkingsverband"
    source_types: ["Organization", "Gemeente", "Provincie"]
    target_types: ["Organization", "Gemeente", "Provincie"]

  - name: "FINANCIERT"
    description: "Financieringsrelatie"
    source_types: ["Ministerie", "Provincie", "Gemeente", "Regeling"]
    target_types: ["RegioDeal", "BeleidsProgramma", "Project"]
    properties:
      - name: "bedrag"
        data_type: "float"
      - name: "type"
        data_type: "enum"
        enum_values: ["subsidie", "cofinanciering", "investering", "bijdrage"]

  # Persoons-relaties
  - name: "IS_BESTUURDER_VAN"
    description: "Bestuurder (wethouder/burgemeester/gedeputeerde) van organisatie of gebied"
    source_types: ["Bestuurder", "Bewindspersoon"]
    target_types: ["Gemeente", "Provincie", "Ministerie"]

  - name: "ONDERTEKENT"
    description: "Persoon ondertekent een convenant of akkoord"
    source_types: ["Bewindspersoon", "Bestuurder"]
    target_types: ["RegioDeal", "Akkoord", "CityDeal", "Woondeal"]

  # Beleidsrelaties
  - name: "IS_PIJLER_VAN"
    description: "Thema of pijler is onderdeel van een deal of programma"
    source_types: ["BeleidsPijler", "BeleidsThema"]
    target_types: ["RegioDeal", "BeleidsProgramma"]

  - name: "VALT_ONDER"
    description: "Valt onder verantwoordelijkheid van ministerie of programma"
    source_types: ["BeleidsProgramma", "Regeling", "Project"]
    target_types: ["Ministerie", "BeleidsProgramma"]

  - name: "RICHT_ZICH_OP"
    description: "Doelstelling of focus"
    source_types: ["RegioDeal", "BeleidsProgramma", "CityDeal", "Project"]
    target_types: ["FunctioneleRegio", "Gemeente", "BeleidsThema", "BeleidsPijler"]
    extraction_hints:
      - "richt zich op, beoogt, streeft naar, met als doel"

  - name: "BOUWT_VOORT_OP"
    description: "Voortzetting of opvolging"
    extraction_hints:
      - "bouwt voort op, vervolg op, in lijn met"

  - name: "INVESTEERT_IN"
    description: "Investering in thema of gebied"
    extraction_hints:
      - "investeert in, zet in op, besteedt aan"

  # Grensoverschrijdend
  - name: "WERKT_GRENSOVERSCHRIJDEND_MET"
    description: "Grensoverschrijdende samenwerking"
    source_types: ["Grensregio", "Gemeente", "Provincie"]
    target_types: ["BuitenlandseRegio", "Land", "InternationaleOrganisatie"]

  # Causale relaties
  - name: "LEIDT_TOT"
    description: "Oorzaak-gevolg relatie"
    extraction_hints:
      - "leidt tot, resulteert in, veroorzaakt, door"

  - name: "VERSTERKT"
    description: "Versterkende of vergrotende relatie"
    extraction_hints:
      - "versterkt, vergroot, vicieuze cirkel, spiraal"

  - name: "VERMINDERT"
    description: "Verminderende of remmende relatie"
    extraction_hints:
      - "vermindert, voorkomt, remt af, doorbreekt"

# =============================================================================
# EXTRACTION PATTERNS
# =============================================================================

extraction_patterns:
  - name: "RegioDealIdentificatie"
    pattern: "(Regio\\s*Deal|Regiodeal)\\s+([\\w\\s\\-]+?)\\s*(I{1,3}|[1-5]e?|eerste|tweede|derde|vierde|vijfde)?"
    description: "Identificeer Regio Deal naam en tranche"

  - name: "PartnerExtractie"
    signals:
      - "in samenwerking met"
      - "samen met"
      - "partners zijn"
      - "deelnemende partijen"
      - "ondertekend door"
      - "namens het Rijk"
      - "regionale partners"

  - name: "ProbleemBeschrijving"
    signals:
      - "kampt met"
      - "uitdagingen op het gebied van"
      - "problematiek rond"
      - "achterstand in"
      - "tekort aan"
      - "stapeling van"

  - name: "Doelstellingen"
    signals:
      - "doel is"
      - "beoogt"
      - "door in te zetten op"
      - "investeren in"
      - "versterken van"
      - "verbeteren van"
      - "realiseren van"

  - name: "FinancieleBedragen"
    pattern: "(€|EUR|euro)\\s*([\\d.,]+)\\s*(miljoen|miljard|mln|mrd)?"
    description: "Extraheer financiële bedragen"

# =============================================================================
# EXTRACTION RULES
# =============================================================================

extraction_rules:
  - "Extract ONLY named entities — not generic descriptions or activities"
  - "If an abbreviation is used (BZK, IZA, GALA), also include the full name"
  - "Classify persons as Bewindspersoon, Bestuurder, or Ambtenaar — NEVER as Gemeente or Ministerie"
  - "Thematic concepts like 'werkgelegenheid', 'leefbaarheid', 'vergrijzing' → BeleidsThema"
  - "Deal pillars like 'Leren', 'Werk en Inkomen' → BeleidsPijler"
  - "Concrete named projects like 'Gezonde Huiskamer', 'Dutch TechZone' → Project"
  - "Do not extract generic terms like 'inwoners', 'jongeren', 'bedrijfsleven', 'overheden'"

# =============================================================================
# CLAIM TYPES
# =============================================================================

claim_types:
  - name: "Feitelijk"
    description: "Feitelijke bewering over huidige of historische situatie"
    indicators:
      - "is"
      - "zijn"
      - "heeft"
      - "telt"
      - "bedraagt"

  - name: "Causaal"
    description: "Bewering over oorzaak-gevolg relatie"
    indicators:
      - "leidt tot"
      - "veroorzaakt"
      - "resulteert in"
      - "door"

  - name: "Normatief"
    description: "Bewering over wat zou moeten"
    indicators:
      - "moet"
      - "dient"
      - "is nodig"
      - "vereist"

  - name: "Predictief"
    description: "Voorspelling over toekomstige ontwikkeling"
    indicators:
      - "zal"
      - "wordt verwacht"
      - "naar verwachting"
