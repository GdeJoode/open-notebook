[project]
name = "enrichment"
version = "0.1.0"
description = "Metadata verification and enrichment pipeline with external API lookups"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "surrealdb-service",
    "llm-manager",
    "httpx>=0.27.0",
    "scholarly>=1.7.0",
    "habanero>=1.2.0",
    "fastapi>=0.104.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30.0"]

[project.scripts]
enrichment = "enrichment.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enrichment"]

[tool.uv.sources]
shared = { workspace = true }
surrealdb-service = { workspace = true }
llm-manager = { workspace = true }
