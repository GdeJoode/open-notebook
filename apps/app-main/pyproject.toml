[project]
name = "app-main"
version = "0.1.0"
description = "Main application - FastAPI backend and orchestration"
requires-python = ">=3.10"
dependencies = [
    "shared",
    "surrealdb-service",
    "file-manager",
    "llm-manager",
    "job-queue",
    "ingestion",
    "ontology-extraction",
    "summarization",
    "embeddings",
    "entity-filtering",
    "retrieval",
    "zotero-integration",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "esperanto>=0.5.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0",
    "networkx>=3.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30.0"]
# Optional lightweight (ML-free) parser engine (Track A.3). Kept out of the base
# install so the image stays lean; enable with the `markitdown` extra to use
# parser_engine="markitdown".
markitdown = ["markitdown>=0.0.1a2"]

[project.scripts]
app-main = "app_main.api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_main"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "requires_docker: Tests that need a Docker daemon (testcontainers-backed). Skipped automatically when Docker is unreachable.",
    "requires_staging: Read-only tests against the live staging DB (SURREAL_DATABASE=staging). Skipped unless explicitly pointed at staging and reachable.",
]

[tool.uv.sources]
shared = { workspace = true }
surrealdb-service = { workspace = true }
file-manager = { workspace = true }
llm-manager = { workspace = true }
ingestion = { workspace = true }
ontology-extraction = { workspace = true }
summarization = { workspace = true }
embeddings = { workspace = true }
entity-filtering = { workspace = true }
retrieval = { workspace = true }
job-queue = { workspace = true }
zotero-integration = { workspace = true }
