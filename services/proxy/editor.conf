# editor-toegang (ADR 0017, 0022 A): alleen naar de editor van Langflow (7860).
# Geen andere bestemming. Het adres van langflow wordt via de DNS van Docker
# opgezocht bij elke aanvraag (na tien seconden opnieuw), zodat een herstart van
# langflow met een ander IP-adres de proxy niet breekt.
server {
    listen 8080;
    client_max_body_size 100m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $editor http://langflow:7860;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    # Langflow stuurt de voortgang van een build als stroom (server-sent events).
    proxy_buffering off;
    proxy_read_timeout 600s;

    # Geen MCP via de editor (FO 11): ook als het image de routes weer zou
    # hebben (services/langflow/Dockerfile).
    location ^~ /api/v1/mcp {
        return 404;
    }
    location ^~ /api/v2/mcp {
        return 404;
    }
    location / {
        proxy_pass $editor;
    }
}
