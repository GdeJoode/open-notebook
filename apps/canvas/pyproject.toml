[project]
name = "canvas"
version = "0.1.0"
description = "Canvas application - Visual note creation and knowledge mapping"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "surrealdb-service",
    "file-manager",
    "llm-manager",
    "retrieval",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30.0"]

[project.scripts]
canvas = "canvas.api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas"]

[tool.uv.sources]
shared = { workspace = true }
surrealdb-service = { workspace = true }
file-manager = { workspace = true }
llm-manager = { workspace = true }
retrieval = { workspace = true }
