[project]
name = "surrealdb-service"
version = "0.1.0"
description = "SurrealDB service layer: connection, repositories and migrations"
requires-python = ">=3.10"
dependencies = [
    "shared",
    # connection.py relies on 1.0.6 internals (recv_task) and works around its
    # cancel race; re-test it before moving the pin.
    "surrealdb==1.0.6",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    # Testcontainers boots a real SurrealDB instance for migration round-trip
    # tests (Track B.0 harness). Gated behind the `requires_docker` marker.
    "testcontainers>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/surrealdb_service"]

[tool.uv.sources]
shared = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "requires_docker: Tests that need a Docker daemon (testcontainers-backed). Skipped automatically when Docker is unreachable.",
]

[dependency-groups]
dev = [
    "testcontainers>=4.0.0",
]
