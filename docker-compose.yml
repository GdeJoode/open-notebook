networks:
  web:
    name: docker-web
    driver: bridge

services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    networks: [web]
    ports:
      - "8000:8000"
    volumes:
      - ./surreal_data:/mydata
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=true
      # Cap the RocksDB block cache. Surreal defaults to 50% of host RAM
      # (~6.25 GB on this 13 GB box), which — together with the app + docling +
      # mineru + local embeddings — caused WSL2 memory pressure that SIGTERM'd
      # surreal under sustained extraction load (clean exit 0, restart:always
      # bounced it → RestartCount climbed, killing long corpus runs). 2 GB is
      # ample read cache for this workload and frees ~4 GB for the rest, so
      # large batch runs (80+ docs) no longer evict surreal.
      - SURREAL_ROCKSDB_BLOCK_CACHE_SIZE=2147483648
    command: start --log info --user root --pass root rocksdb:/mydata/mydatabase.db
    pull_policy: always
    user: root
    restart: always
    # Safety net: a generous hard limit so surreal can't balloon past the
    # block-cache + working set and starve the other services. Block cache (2 GB)
    # + overhead sits well under 4 GB, so this should never OOM-kill in practice.
    mem_limit: 4g
  # GROBID — style-agnostic reference parsing (Track V, replaces the V.2/V.3
  # heuristic). Lightweight CRF image (~500MB, CPU-only); pinned for reproducible
  # parsing. API on 8070. Fed source PDFs via POST /api/processReferences.
  grobid:
    image: grobid/grobid:0.8.2-crf
    init: true
    ulimits:
      core: 0
    networks: [web]
    ports:
      - "8070:8070"
    restart: unless-stopped

  docling:
    build:
      context: .
      dockerfile: services/docling/Dockerfile
    networks: [web]
    ports:
      - "8100:8100"
    volumes:
      - ./docling_input:/data/input
      - ./docling_output:/data/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - DOCLING_DEVICE=cuda
      - DOCLING_NUM_THREADS=4
      - DOCLING_DO_OCR=true
      - DOCLING_OCR_ENGINE=easyocr
      - DOCLING_OCR_LANG=en
      - DOCLING_DO_TABLE_STRUCTURE=true
      - DOCLING_TABLE_MODE=accurate
      - DOCLING_GENERATE_PAGE_IMAGES=false
      - DOCLING_GENERATE_PICTURE_IMAGES=true
      - DOCLING_IMAGES_SCALE=2.0
      # Picture classification/description via docling's internal VLM is
      # memory-heavy on large scanned PDFs (GPU OOM on 20+ MB files).
      # Disabled by default; opt in via env override when needed.
      - DOCLING_DO_PICTURE_CLASSIFICATION=false
      - DOCLING_DO_PICTURE_DESCRIPTION=false
      - DOCLING_VLM_MODEL=HuggingFaceTB/SmolVLM-256M-Instruct
      - DOCLING_DO_FORMULA_EXTRACTION=true
      - DOCLING_DO_CODE_ENRICHMENT=true
      - DOCLING_ORGANIZE_BY_PAGE=true
      - VLM_PROVIDER=ollama
      - VLM_MODEL=granite3.2-vision
      - VLM_BASE_URL=http://host.docker.internal:11434
      - VLM_TIMEOUT=120
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
  summarization:
    build:
      context: .
      dockerfile: services/summarization/Dockerfile
    networks: [web]
    ports:
      - "8101:8101"
    volumes:
      - ./summarization_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SUMMARIZATION_PROVIDER=ollama
      - SUMMARIZATION_MODEL=llama3.1:8b-instruct-q4_0
      - SUMMARIZATION_BASE_URL=http://host.docker.internal:11434
      - SUMMARIZATION_TEMPERATURE=0.1
      - SUMMARIZATION_MAX_TOKENS=3000
      - EMBEDDING_PROVIDER=ollama
      - EMBEDDING_MODEL=nomic-embed-text
      - EMBEDDING_BASE_URL=http://host.docker.internal:11434
      - LLM_API_KEY=
      # esperanto LLM default timeout is 60s — too tight for qwen2.5:14b on this GPU.
      # 600s = 10 min per LLM-call; enough headroom for slower, higher-quality models.
      - ESPERANTO_LLM_TIMEOUT=600
    restart: always
  whisperx:
    build:
      context: .
      dockerfile: services/whisperx/Dockerfile
    networks: [web]
    ports:
      - "8102:8102"
    volumes:
      - ./whisperx_data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - WHISPERX_MODEL=large-v3
      - WHISPERX_LANGUAGE=
      - WHISPERX_DEVICE=cuda
      - WHISPERX_COMPUTE_TYPE=float16
      - WHISPERX_BATCH_SIZE=16
      - WHISPERX_DIARIZATION=true
      - WHISPERX_MIN_SPEAKERS=
      - WHISPERX_MAX_SPEAKERS=
      - WHISPERX_WORD_TIMESTAMPS=true
      - HF_TOKEN=${HF_TOKEN:-}
    restart: always
  extraction:
    build:
      context: .
      dockerfile: services/extraction/Dockerfile
    networks: [web]
    ports:
      - "8103:8103"
    volumes:
      - ./docling_output:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      # No EXTRACTION_MODEL / EXTRACTION_NUM_CTX here: the extraction service
      # routes through packages/shared/src/shared/model_routing.yaml
      # (extraction.<privacy>.model / .num_ctx). Both were set here for a long
      # time, read into constants nothing used, and configured nothing — which is
      # exactly why they are gone rather than corrected.
      - EXTRACTION_CHUNK_SIZE=4000
      - EMBEDDING_MODEL=mxbai-embed-large
      - SURREALDB_URL=ws://surrealdb:8000/rpc
      - SURREALDB_NS=open_notebook
      - SURREALDB_DB=open_notebook
      - SURREALDB_USER=root
      - SURREALDB_PASS=root
      - DEFAULT_ONTOLOGY=regiodeal
      - DEFAULT_PRIVACY=internal
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_API_URL=https://integrate.api.nvidia.com/v1
    restart: always
  mineru:
    build:
      context: .
      dockerfile: services/mineru/Dockerfile
    networks: [web]
    ports:
      - "8104:8104"
    volumes:
      # Shared input dir with docling — both parsers read from the same
      # staged-upload location. Each parser writes to its own output dir
      # (./mineru_output here, ./docling_output for docling) so the
      # confidence-fallback flow in Phase A.1c can compare results
      # without cross-contamination.
      - ./docling_input:/data/input
      - ./mineru_output:/data/mineru_output
      # Persistent model cache — first-run downloads are ~5–8 GB.
      - mineru_models:/data/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - MINERU_DEVICE=cuda
      - MINERU_BACKEND=pipeline
      - MINERU_METHOD=auto
      - MINERU_LANG=en
      - MINERU_FORMULA_ENABLE=true
      - MINERU_TABLE_ENABLE=true
      - MINERU_TIMEOUT_SECONDS=1800
      # Switch to modelscope mirror if HuggingFace is unreachable:
      # - MINERU_MODEL_SOURCE=modelscope
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
  reranker:
    build:
      context: .
      dockerfile: services/reranker/Dockerfile
    networks: [web]
    ports:
      - "8105:8105"
    volumes:
      # Persistent HuggingFace cache so bge-reranker-v2-m3 (~2 GB) is
      # downloaded once across container restarts.
      - reranker_models:/data/models
    environment:
      # Multilingual cross-encoder — the corpus is Dutch. Override to tune
      # size/latency (e.g. a smaller variant).
      - RERANKER_MODEL=BAAI/bge-reranker-v2-m3
      # CPU by default. To use a GPU, set RERANKER_DEVICE=cuda and add an
      # nvidia deploy.resources reservation block like docling/whisperx.
      - RERANKER_DEVICE=
      - HF_HOME=/data/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
  open_notebook:
    build:
      context: .
      dockerfile: Dockerfile
    networks: [web]
    ports:
      - "8502:8502"
      - "5055:5055"
    env_file:
      - ./docker.env
    environment:
      - SURREAL_URL=ws://surrealdb:8000
      - OLLAMA_API_BASE=http://host.docker.internal:11434
      - OLLAMA_URL=http://host.docker.internal:11434
      - DOCLING_SERVICE_URL=http://docling:8100
      - USE_DOCLING_SERVICE=true
      - MINERU_SERVICE_URL=http://mineru:8104
      - RERANKER_SERVICE_URL=http://reranker:8105
      # Reference extraction (Track V) reaches GROBID over the compose network.
      # Without this the service defaults to localhost:8070 — the app container
      # itself, not the grobid service. No hard depends_on (like mineru): the
      # guarded reference hook is opt-in and fails soft when GROBID is down.
      - GROBID_URL=http://grobid:8070
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No hard depends_on for mineru — the app must boot when the MinerU
    # service is down or being rebuilt; parser_engine routing falls back
    # to docling in that case.
    depends_on:
      - surrealdb
      - docling
    volumes:
      - ./notebook_data:/app/data
      # Shared with docling + mineru services — same paths in all containers
      # so the services can read files the main app writes, and the main app
      # can read the services' output.
      - ./docling_input:/data/input
      - ./docling_output:/data/output
      - ./mineru_output:/data/mineru_output
    restart: always

volumes:
  mineru_models:
  reranker_models:
