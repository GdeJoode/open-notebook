[project]
name = "ingestion"
version = "0.1.0"
description = "Document ingestion pipeline - parsing, chunking, source creation"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "surrealdb-service",
    "file-manager",
    "llm-manager",
    "docling>=2.58.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "aiofiles>=23.0.0",
    "yt-dlp>=2024.0.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30.0"]
gpu = ["torch>=2.0.0"]
audio = ["whisperx>=3.0.0", "torch>=2.0.0", "torchaudio>=2.0.0"]

[project.scripts]
ingestion = "ingestion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[tool.uv.sources]
shared = { workspace = true }
surrealdb-service = { workspace = true }
file-manager = { workspace = true }
llm-manager = { workspace = true }
