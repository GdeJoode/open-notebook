[project]
name = "shared"
version = "0.1.0"
description = "Shared models, utilities, and configuration for open-notebook"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.2",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=4.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
