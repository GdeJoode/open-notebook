# regiodeal.yaml
# Samengestelde ontologie voor Regio Deal documenten
#
# Combineert:
#   - government.yaml    → organisaties, geografie, personen
#   - policy_themes.yaml → brede welvaart, beleidsthema's
#   - instruments.yaml   → juridisch, kennis, financieel instrumentarium
#   - deals.yaml         → deal-hiërarchie (RegioDeal, Woondeal, CityDeal)
#
# Dit bestand voegt alleen regiodeal-specifieke extractiepatronen en
# claim types toe. Alle entity types staan in de bovenstaande bestanden.

metadata:
  name: "regiodeal"
  version: "2.1.0"
  description: "Samengestelde ontologie voor Regio Deal documenten"
  extends: "deals"
  includes:
    - "government"
    - "policy_themes"
    - "instruments"
    - "deals"

# =============================================================================
# Regiodeal-specifieke extractiepatronen
# =============================================================================

extraction_patterns:
  - name: "RegioDealIdentificatie"
    pattern: "(Regio\\s*Deal|Regiodeal)\\s+([\\w\\s\\-]+?)\\s*(I{1,3}|[1-5]e?|eerste|tweede|derde|vierde|vijfde)?"
    description: "Identificeer Regio Deal naam en tranche"

  - name: "ProbleemBeschrijving"
    signals:
      - "kampt met"
      - "uitdagingen op het gebied van"
      - "problematiek rond"
      - "achterstand in"
      - "tekort aan"
      - "stapeling van"

  - name: "Doelstellingen"
    signals:
      - "doel is"
      - "beoogt"
      - "door in te zetten op"
      - "investeren in"
      - "versterken van"
      - "verbeteren van"

# =============================================================================
# Claim types (specifiek voor beleidsanalyse)
# =============================================================================

claim_types:
  - name: "Feitelijk"
    description: "Feitelijke bewering over huidige of historische situatie"
    indicators: ["is", "zijn", "heeft", "telt", "bedraagt"]

  - name: "Causaal"
    description: "Bewering over oorzaak-gevolg relatie"
    indicators: ["leidt tot", "veroorzaakt", "resulteert in", "door"]

  - name: "Normatief"
    description: "Bewering over wat zou moeten"
    indicators: ["moet", "dient", "is nodig", "vereist"]

  - name: "Predictief"
    description: "Voorspelling over toekomstige ontwikkeling"
    indicators: ["zal", "wordt verwacht", "naar verwachting"]

# =============================================================================
# Samengestelde extractie-regels
# =============================================================================

extraction_rules:
  # Personen
  - "Classify persons as Bewindspersoon, Bestuurder, or Ambtenaar — NEVER as Gemeente or Ministerie"
  # Afkortingen
  - "If an abbreviation is used (BZK, IZA, GALA), also include the full name"
  # Generiek
  - "Do not extract generic terms: inwoners, jongeren, bedrijfsleven, overheden, sectoren"
  # Thema's vs regio's
  - "Deal pillars (Leren, Werk en Inkomen, Gezondheid) → BeleidsPijler, not FunctioneleRegio"
  - "Broad welfare themes (vergrijzing, leefbaarheid) → BeleidsThema"
  # Projecten
  - "Named projects (Gezonde Huiskamer, Dutch TechZone) → Project, not FunctioneleRegio"
  - "Physical facilities (campus, hub, centrum) → Voorziening"
  # Instrumenten
  - "Laws (Omgevingswet, Woningwet) → Wet, not BeleidsProgramma"
  - "Regulations (SPUK, JTF) → Subsidieregeling or Fonds"
  - "Accords (GALA, IZA, Preventieakkoord) → Akkoord, not BeleidsProgramma"
  # Internationaal
  - "Foreign countries → Land, foreign regions → BuitenlandseRegio"
  - "EU, UN → InternationaleOrganisatie"
