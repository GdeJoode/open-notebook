# policy_themes.yaml
# Beleidsthema's, brede welvaart en thematische concepten

metadata:
  name: "policy_themes"
  version: "1.0.0"
  description: "Brede welvaart thema's, beleidsthema's en indicatoren"

entity_types:
  - name: "BeleidsThema"
    description: "Overkoepelend beleidsthema rond brede welvaart en leefbaarheid"
    parent_type: "Concept"
    graph_relevance: "active"
    # The extraction_hints double as the schema-APPLICATION signal (Track L.4):
    # ``detect_applicable_schemas`` scores these phrases against the document body
    # so a document *about* these themes selects ``policy_themes`` on content,
    # independent of whether a gov/deals schema also fires. Keep the concrete
    # Dutch theme vocabulary here so the matcher has real keywords to bite on —
    # the type NAME ``BeleidsThema`` itself almost never appears verbatim.
    extraction_hints:
      - "brede welvaart"
      - "leefbaarheid"
      - "vergrijzing"
      - "ontgroening"
      - "bevolkingsdaling"
      - "bevolkingskrimp"
      - "gezondheid"
      - "werkgelegenheid"
      - "bereikbaarheid"
      - "wonen"
      - "leefomgeving"
      - "voorzieningenniveau"
      - "materiele welvaart"
      - "bestaanszekerheid"
      - "kansenongelijkheid"
      - "woningmarkt"
      - "Alleen herkenbare, benoemde thema's"

  - name: "BeleidsPijler"
    description: "Pijler of speerpunt binnen een specifiek programma of deal"
    parent_type: "Concept"
    graph_relevance: "active"
    extraction_hints:
      - "De pijlers/speerpunten van een regio deal of programma"
      - "Alleen als expliciet als pijler of speerpunt benoemd"

  - name: "Indicator"
    description: "Meetbare indicator voor brede welvaart of beleid"
    parent_type: "Concept"
    graph_relevance: "active"
    extraction_hints:
      - "Netto arbeidsparticipatie, levensverwachting, woningtekort"
      - "Meetbare grootheden uit CBS Monitor Brede Welvaart"

concepts:
  - name: "BredeWelvaart"
    description: "Overkoepelend concept voor kwaliteit van leven in brede zin"
    related_concepts:
      - "MaterieleWelvaart"
      - "Gezondheid"
      - "WonenLeefomgeving"
      - "ArbeidVrijeTijd"
      - "OnderwijsOntwikkeling"
      - "SocialeVerbondenheid"
      - "Veiligheid"

  - name: "MaterieleWelvaart"
    description: "Inkomen, vermogen, werk, koopkracht"
    indicators: ["inkomen per hoofd", "werkloosheidspercentage", "armoede", "schulden"]

  - name: "Gezondheid"
    description: "Levensverwachting, ziekte, leefstijl, zorggebruik"
    indicators: ["levensverwachting", "gezonde levensjaren", "overgewicht"]

  - name: "WonenLeefomgeving"
    description: "Woningkwaliteit, woonomgeving, groen, veiligheid"
    indicators: ["woningtekort", "woontevredenheid", "afstand tot groen"]

  - name: "Vergrijzing"
    description: "Toename aandeel ouderen in de bevolking"
    related_concepts: ["Ontgroening", "BevolkingsDaling"]

  - name: "BevolkingsDaling"
    description: "Structurele afname van bevolkingsomvang (krimp)"
    related_concepts: ["Vergrijzing", "Leegstand"]

  - name: "VoorzieningenNiveau"
    description: "Beschikbaarheid en bereikbaarheid van voorzieningen"
    indicators: ["afstand tot huisarts", "afstand tot basisschool", "OV-bereikbaarheid"]

  - name: "Leefbaarheid"
    description: "Kwaliteit van woon- en leefomgeving"

  - name: "Vitaliteit"
    description: "Veerkracht en toekomstbestendigheid van een gebied"

relationship_types:
  - name: "IS_PIJLER_VAN"
    description: "Thema of pijler is onderdeel van een deal of programma"
    source_types: ["BeleidsPijler", "BeleidsThema"]
    target_types: ["*"]

  - name: "LEIDT_TOT"
    description: "Oorzaak-gevolg relatie"
    extraction_hints: ["leidt tot, resulteert in, veroorzaakt"]

  - name: "VERSTERKT"
    description: "Versterkende relatie"
    extraction_hints: ["versterkt, vergroot, vicieuze cirkel"]

  - name: "VERMINDERT"
    description: "Verminderende relatie"
    extraction_hints: ["vermindert, voorkomt, remt af, doorbreekt"]

  # Track N.5b — subsumption between EXTRACTED ENTITIES, mined deterministically
  # from Hearst patterns ("dorpshuizen en andere ontmoetingspunten"). Declared
  # here so it is a first-class predicate rather than one that survives by
  # accident: before this, `is_a` appeared in no ontology, and the only reason
  # the mined edges were not deleted is that `OntologyValidator` downgrades an
  # unknown predicate to a WARNING outside strict mode. Turning on `strict_mode`
  # removed every mined hierarchy edge silently.
  #
  # The miner itself is DEFAULT-OFF (`EXTRACTION_HEARST_ISA`, see
  # `pass2_typed_extraction`). Measured on an eight-document corpus it produced
  # 220 raw pairs and ZERO edges in the graph, because its precision gate needs
  # both endpoints to be entities the LLM extracted for the same chunk. The
  # declaration exists so that whoever turns it back on gets a predicate the
  # validator recognises — not so that something starts flowing today.
  #
  # NOT the same relation as `parent_type` on an entity TYPE: that is subsumption
  # in the schema, which D-N4-12 moved to the type boundary. This is subsumption
  # between two instances mentioned in a document.
  - name: "is_a"
    description: "The subject is a kind of the object (instance-level subsumption)"
    schema_org: "https://schema.org/additionalType"
    source_types: ["*"]
    target_types: ["*"]
    cardinality: "many_to_many"
