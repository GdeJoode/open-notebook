[project]
name = "job-queue"
version = "0.1.0"
description = "Background job queue for async pipeline execution"
requires-python = ">=3.10"
dependencies = [
    "shared",
    "surrealdb-service",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_queue"]
