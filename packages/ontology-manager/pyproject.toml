[project]
name = "ontology-manager"
version = "0.1.0"
description = "Ontology schema management, versioning, and evolution tracking"
requires-python = ">=3.10"
dependencies = [
    "shared",
    "surrealdb-service",
    "semantic-intelligence",
    "pyyaml>=6.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.2",
    "httpx>=0.27.0",
    "rdflib>=7.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "pytest-cov>=4.0.0", "pyshacl>=0.25.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontology_manager"]

[tool.uv.sources]
shared = { workspace = true }
surrealdb-service = { workspace = true }
semantic-intelligence = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
