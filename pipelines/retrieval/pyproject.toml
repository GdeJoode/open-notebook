[project]
name = "retrieval"
version = "0.1.0"
description = "Retrieval pipeline - vector search and knowledge graph queries"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "surrealdb-service",
    "llm-manager",
    "networkx>=3.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30.0"]

[project.scripts]
retrieval = "retrieval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval"]

[tool.uv.sources]
shared = { workspace = true }
surrealdb-service = { workspace = true }
llm-manager = { workspace = true }
