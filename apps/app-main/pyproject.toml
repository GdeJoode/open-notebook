[project]
name = "app-main"
version = "0.1.0"
description = "Main application - FastAPI backend and orchestration"
requires-python = ">=3.10"
dependencies = [
    "shared",
    "surrealdb-service",
    "file-manager",
    "llm-manager",
    "job-queue",
    "ingestion",
    "ontology-extraction",
    "summarization",
    "enrichment",
    "embeddings",
    "retrieval",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "esperanto>=0.5.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30.0"]

[project.scripts]
app-main = "app_main.api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_main"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.uv.sources]
shared = { workspace = true }
surrealdb-service = { workspace = true }
file-manager = { workspace = true }
llm-manager = { workspace = true }
ingestion = { workspace = true }
ontology-extraction = { workspace = true }
summarization = { workspace = true }
enrichment = { workspace = true }
embeddings = { workspace = true }
retrieval = { workspace = true }
job-queue = { workspace = true }
