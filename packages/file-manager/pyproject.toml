[project]
name = "file-manager"
version = "0.1.0"
description = "File and knowledge base management for open-notebook"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "surrealdb-service",
    "aiofiles>=23.0.0",
    "watchfiles>=0.21.0",
    "python-magic>=0.4.27",
    "fastapi>=0.104.0",
    "mcp>=1.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[project.scripts]
file-manager = "file_manager.api.app:main"
file-manager-mcp = "file_manager.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/file_manager"]

[tool.uv.sources]
shared = { workspace = true }
surrealdb-service = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
