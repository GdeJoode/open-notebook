[project]
name = "ontology-extraction"
version = "0.1.0"
description = "Ontology-guided entity and relation extraction via LLM"
requires-python = ">=3.10"
dependencies = [
    "shared",
    "surrealdb-service",
    "llm-manager",
    "ontology-manager",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    # Track N.1: spaCy noun-chunks for the pre-LLM candidate layer. The model is
    # URL-pinned so `uv sync --frozen` (the container build) installs it from the
    # lock — no separate `spacy download` build step, and CI/tests get the real
    # spaCy path too. candidates.py lazy-loads + falls back to regex, so a resolve
    # hiccup never hard-fails extraction.
    "spacy>=3.8,<3.9",
    "en_core_web_sm",
    "nl_core_news_sm",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "pytest-cov>=4.0.0"]
langextract = ["langextract>=0.5.0"]

[project.scripts]
ontology-extraction = "ontology_extraction.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontology_extraction"]

[tool.uv.sources]
shared = { workspace = true }
surrealdb-service = { workspace = true }
llm-manager = { workspace = true }
ontology-manager = { workspace = true }
# Track N.1: the spaCy models as URL-pinned wheels so they lock + install with
# `uv sync --frozen` (no separate `spacy download` step). Both EN + NL — the
# candidate layer picks the model per document language (Dutch policy corpus).
en_core_web_sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
nl_core_news_sm = { url = "https://github.com/explosion/spacy-models/releases/download/nl_core_news_sm-3.8.0/nl_core_news_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
