[project]
name = "summarization"
version = "0.1.0"
description = "Summarization pipeline - RAPTOR and TreeKG strategies"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "surrealdb-service",
    "llm-manager",
    "networkx>=3.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30.0"]

[project.scripts]
summarization = "summarization.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/summarization"]

[tool.uv.sources]
shared = { workspace = true }
surrealdb-service = { workspace = true }
llm-manager = { workspace = true }
