# editor-toegang (ADR 0017, 0022 A): alleen naar de editor van Langflow (7860).
# Geen andere bestemming. Het adres van langflow wordt via de DNS van Docker
# opgezocht bij elke aanvraag (na tien seconden opnieuw), zodat een herstart van
# langflow met een ander IP-adres de proxy niet breekt.
server {
    listen 8080;
    client_max_body_size 100m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $editor http://langflow:7860;

    # Alleen de editor op deze machine: de Host-header moet 127.0.0.1:8530 of
    # localhost:8530 zijn. Dat sluit DNS-rebinding uit (een webpagina die via
    # een eigen domeinnaam naar 127.0.0.1 wijst). De poort ligt vast; wie
    # SIGNAAL_EDITOR_POORT wijzigt, past dit ook aan (herreview F2-12, punt 1).
    if ($http_host !~ "^(127\.0\.0\.1|localhost):8530$") {
        return 421;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    # Langflow stuurt de voortgang van een build als stroom (server-sent events).
    proxy_buffering off;
    proxy_read_timeout 600s;

    # Geen MCP en geen andere agentinterface via de editor (FO 11): ook als het
    # image de routes weer zou hebben (services/langflow/Dockerfile). Ook de
    # assistent (/api/v1/agentic, met een eigen MCP-server), A2A en de
    # OpenAI-Responses-API.
    location ^~ /api/v1/mcp {
        return 404;
    }
    location ^~ /api/v2/mcp {
        return 404;
    }
    location ^~ /api/v1/agentic {
        return 404;
    }
    location ^~ /api/v1/a2a {
        return 404;
    }
    location ^~ /api/v1/responses {
        return 404;
    }
    # Geen Langflow Store (haalt componenten van internet).
    location ^~ /api/v1/store {
        return 404;
    }
    # Geen flows draaien buiten de editor om (herreview F2-12, punt 1 en 2): de
    # editor zelf bouwt via /api/v1/build. Ook /api/v1/webhook-events valt
    # hieronder, en de spraak-websocket.
    location ^~ /api/v1/run {
        return 404;
    }
    location ^~ /api/v1/webhook {
        return 404;
    }
    location ^~ /api/v1/process {
        return 404;
    }
    location ^~ /api/v1/predict {
        return 404;
    }
    location ^~ /api/v1/build_public_tmp {
        return 404;
    }
    location ^~ /api/v1/flows/public_flow {
        return 404;
    }
    location ^~ /api/v2/workflows {
        return 404;
    }
    location ^~ /api/v1/voice {
        return 404;
    }
    location / {
        proxy_pass $editor;
    }
}
