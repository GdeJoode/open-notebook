[project]
name = "llm-manager"
version = "0.1.0"
description = "Modelpoort, modelregister en usage tracking"
requires-python = ">=3.10"
dependencies = [
    "shared",
    "surrealdb-service",
    "httpx>=0.27.0",
    "tiktoken>=0.8.0",
    "fastapi>=0.104.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.30.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_manager"]

[tool.uv.sources]
shared = { workspace = true }
surrealdb-service = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
