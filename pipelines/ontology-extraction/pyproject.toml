[project]
name = "ontology-extraction"
version = "0.1.0"
description = "Ontology-guided entity and relation extraction via LLM"
requires-python = ">=3.10"
dependencies = [
    "shared",
    "surrealdb-service",
    "llm-manager",
    "ontology-manager",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "pytest-cov>=4.0.0"]
langextract = ["langextract>=0.5.0"]

[project.scripts]
ontology-extraction = "ontology_extraction.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontology_extraction"]

[tool.uv.sources]
shared = { workspace = true }
surrealdb-service = { workspace = true }
llm-manager = { workspace = true }
ontology-manager = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
