# Signaalsysteem: Compose-basis (F2-10; plan van aanpak §4; ADR 0002 F, 0016, 0021, 0022 A).
#
# Starten ALLEEN via:  bash scripts/signaalsysteem/start.sh [--build]
#   Geen kale `docker compose up`: start.sh maakt de kloon van de flowmap,
#   geeft de commit van de fork mee en draait de startcontrole van de padlijsten.
# Stoppen:  bash scripts/signaalsysteem/stop.sh   (zonder volumes te verwijderen)
#
# Naast docker-compose.yml (de oude stack, archief tot F2-23); deze opzet koppelt
# ./surreal_data niet en heeft een eigen, nieuw volume signaal_surreal_data (B3).
# Geheimen staan als bestand in secrets/ (buiten Git); hostpaden in .env
# (voorbeeld in .env.example). Geen dienst behalve de proxy's publiceert een
# poort, en een proxy alleen op 127.0.0.1.
name: signaal

networks:
  # Intern: geen internet en geen bereikbare poort (P8, K1 en K2).
  opslag:         { internal: true }   # alleen surrealdb en open-notebook
  verwerking:     { internal: true }   # de keten (langflow, llama-swap, docling-serve, ... vanaf F2-11/F2-12)
  beheer:         { internal: true }   # llama-swap en socket-proxy (F2-11)
  werkbak-intern: { internal: true }   # werkbak-toegang en open-notebook (ADR 0016)
  editor-intern:  { internal: true }   # editor-toegang en langflow (F2-12)
  mcp-intern:     { internal: true }   # mcp-toegang en open-notebook-mcp (F3-10)
  ophalen-intern: { internal: true }   # langflow, ophalen, open-notebook (F4-13)
  gateway-intern: { internal: true }   # langflow, cloud-gateway, open-notebook (F5-07)
  cli-intern:     { internal: true }   # cloud-gateway en claude-cli (F5-07)
  # Gewoon: alleen de proxy's. Een proxy op toegang heeft uitgaand internet; ook
  # enable_ip_masquerade=false verandert dat onder Docker Desktop niet (proef
  # masquerade, F2-10). Daarom is elke proxy gehard (services/proxy/Dockerfile).
  # Zonder ICC bereiken de proxy's elkaar niet over toegang; hun gepubliceerde
  # poort blijft bereikbaar (F2-10, review B1).
  toegang:
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
  uitgaand: {}                         # alleen ophalen (F4-13) en cloud-gateway (F5-07)

secrets:
  surreal_gebruiker:  { file: ./secrets/surreal_gebruiker }
  surreal_wachtwoord: { file: ./secrets/surreal_wachtwoord }
  # Bron is een bestand: de koppeling blijft ook bij `docker start` door
  # llama-swap (bij bron environment niet; proeven.md §8 punt 24). start.sh
  # maakt het bestand aan als het ontbreekt.
  docling_api_key:
    file: ./secrets/docling_api_key
  # Langflow (F2-12, ADR 0022 F): alleen deze drie, geen Claude-sleutel. start.sh
  # maakt het wachtwoord en de Fernet-sleutel aan als ze ontbreken, en een leeg
  # bestand voor de pijplijnsleutel; die maakt de beheerder met maak_sleutel.py
  # (docs/signaalsysteem/README.md, Beheer).
  sleutel_pijplijn:
    file: ./secrets/sleutel_pijplijn
  langflow_superuser:
    file: ./secrets/langflow_superuser
  langflow_secret_key:
    file: ./secrets/langflow_secret_key

volumes:
  signaal_surreal_data:
    name: signaal_surreal_data   # B3: nieuw en leeg; ./surreal_data blijft archief
  bronarchief: {}                # originelen; langflow schrijft (F2-12), open-notebook leest
  fork_archief: {}               # kopie van elk origineel; alleen open-notebook (F2-14)
  fork_data: {}                  # DATA_FOLDER van de fork (checkpoints, uploads)
  langflow_data: {}              # SQLite en instellingen van Langflow (ADR 0017 D)
  # Modellen: gevuld en gecontroleerd (SHA-256) met de beheerstap
  # scripts/signaalsysteem/modellen_laden.sh; extern, zodat stop.sh en
  # `down -v` ze laten staan. Alleen-lezen gekoppeld.
  modellen:
    name: signaal_modellen
    external: true
  docling_artifacts:
    name: signaal_docling_artifacts
    external: true

services:
  surrealdb:
    build:
      context: services/surrealdb
    image: signaal/surrealdb:v2.7.0
    networks: [opslag]
    secrets: [surreal_gebruiker, surreal_wachtwoord]
    volumes:
      - signaal_surreal_data:/data
    # Het image declareert VOLUME /logs; tmpfs voorkomt een anoniem volume.
    tmpfs: [/logs]
    environment:
      SURREAL_ROCKSDB_BLOCK_CACHE_SIZE: "536870912"
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 24
    mem_limit: 2g
    restart: unless-stopped

  open-notebook:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SIGNAAL_FORK_COMMIT: ${SIGNAAL_FORK_COMMIT:-onbekend}   # start.sh: HEAD (K2)
    image: signaal/open-notebook:lokaal
    networks: [opslag, verwerking, werkbak-intern]
    entrypoint: ["/app/.venv/bin/python", "/app/services/open-notebook/start.py"]
    secrets: [surreal_gebruiker, surreal_wachtwoord]
    depends_on:
      surrealdb: { condition: service_healthy }
    environment:
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_NAMESPACE: signaal
      SURREAL_DATABASE: ${SIGNAAL_SURREAL_DATABASE:-signaal}
      DATA_FOLDER: /app/data
      # Next.js luistert anders alleen op het adres van HOSTNAME (één netwerk).
      HOSTNAME: 0.0.0.0
      # supervisord start de API met `uv run`; zonder internet niets synchroniseren.
      UV_NO_SYNC: "1"
      UV_OFFLINE: "1"
      # De interface roept de API aan via dezelfde proxy (zelfde herkomst).
      API_URL: http://127.0.0.1:${SIGNAAL_WERKBAK_POORT:-8520}
      SIGNAAL_MODELREGISTER: /app/config/modelregister.yaml
      SIGNAAL_RUN_MAX_MINUTEN: ${SIGNAAL_RUN_MAX_MINUTEN:-360}
      SIGNAAL_FLOWS_DIR: /app/flows-git/services/langflow/flows
      SIGNAAL_FLOWS_COMMIT: ${SIGNAAL_FLOWS_COMMIT:-}
      # Padlijsten (ADR 0020): precies de koppelpunten hieronder.
      SIGNAAL_INNAME_PADEN: /inname;/watchfolder
      SIGNAAL_INNAME_URLS: ${SIGNAAL_INNAME_URLS:-}
      SIGNAAL_VAULT_PADEN: /vault
      SIGNAAL_EXPORTMAP_PADEN: /export
      SIGNAAL_BRONARCHIEF: /bronarchief
      SIGNAAL_FORK_ARCHIEF: /fork_archief
      # Minimale kloon van de flowmap (start.sh), alleen-lezen, voor het
      # flowregister (F2-04); niet de .git van de host.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /app/flows-git
    volumes:
      - ./config:/app/config:ro
      - ${SIGNAAL_FLOWS_KLOON:?start via scripts/signaalsysteem/start.sh}:/app/flows-git:ro
      - fork_data:/app/data
      - bronarchief:/bronarchief:ro
      - fork_archief:/fork_archief
      - ${SIGNAAL_INNAMEMAP:?zet SIGNAAL_INNAMEMAP in .env}:/inname:ro
      - ${SIGNAAL_WATCHFOLDER:?zet SIGNAAL_WATCHFOLDER in .env}:/watchfolder:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5055/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  werkbak-toegang:                # alleen 127.0.0.1, niet via Tailscale (ADR 0016)
    build:
      context: services/proxy
      args: { CONF: werkbak.conf }
    image: signaal/werkbak-toegang:1.29.3
    networks: [werkbak-intern, toegang]
    ports:
      - "127.0.0.1:${SIGNAAL_WERKBAK_POORT:-8520}:8080"
    depends_on:
      open-notebook: { condition: service_started }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "101:101"
    restart: unless-stopped

  # ---------------------------------------------------------------- Langflow (F2-12)
  # ADR 0017, 0022: nooit aan uitgaand of toegang; geen internet, geen Claude-
  # sleutel. De editor alleen via editor-toegang op 127.0.0.1. Het startscript
  # (services/langflow/scripts/start.sh) weigert een verboden variabele en een
  # afwijkende instelling hieronder, toetst de flows aan de componentenlijst,
  # laadt ze uit de kloon van HEAD en zet hun triggers aan.
  langflow:
    build:
      context: services/langflow
      additional_contexts:
        llm_manager: packages/llm-manager/src/llm_manager
    image: signaal/langflow:1.13.0
    networks: [verwerking, editor-intern]   # fase 4: + ophalen-intern; fase 5: + gateway-intern
    secrets: [sleutel_pijplijn, langflow_superuser, langflow_secret_key]
    environment:
      LANGFLOW_HOST: 0.0.0.0
      LANGFLOW_PORT: "7860"
      LANGFLOW_CONFIG_DIR: /app/data/langflow
      LANGFLOW_DATABASE_URL: sqlite:////app/data/langflow/langflow.db
      LANGFLOW_SUPERUSER: signaalbeheer
      LANGFLOW_AUTO_LOGIN: "false"
      # Geen MCP-server, geen MCP Composer (die installeert pakketten bij het starten).
      LANGFLOW_MCP_SERVER_ENABLED: "false"
      LANGFLOW_ADD_PROJECTS_TO_MCP_SERVERS: "false"
      LANGFLOW_MCP_COMPOSER_ENABLED: "false"
      # Componenten (ADR 0022 D): geen eigen code in de editor; alleen de eigen map,
      # uit de kloon van HEAD (review F2-12, punt 3).
      LANGFLOW_COMPONENTS_PATH: /app/flows-git/services/langflow/components
      LANGFLOW_ALLOW_CUSTOM_COMPONENTS: "false"
      LANGFLOW_SUBSTITUTE_OUTDATED_COMPONENT_CODE: "false"
      LANGFLOW_BLOCK_CODE_INTERPRETER_COMPONENTS: "true"
      LANGFLOW_AGENTIC_EXPERIENCE: "false"
      LANGFLOW_ALLOW_COMPONENTS_PATHS_OVERRIDE: "true"
      # Voorbeeldprojecten bevatten componenten die niet op de lijst staan.
      LANGFLOW_CREATE_STARTER_PROJECTS: "false"
      # Geen Langflow Store (haalt componenten van internet).
      LANGFLOW_STORE: "false"
      # Alleen de editor via editor-toegang (standaard "*"; herreview F2-12).
      LANGFLOW_CORS_ORIGINS: http://127.0.0.1:8530
      # Geen tracing en geen telemetrie (ADR 0022 F); LiteLLM gebruikt zijn eigen
      # kostentabel in plaats van die van GitHub (ADR 0017, P2).
      LANGFLOW_DEACTIVATE_TRACING: "true"
      DO_NOT_TRACK: "true"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      # Geen modellencatalogus van models.dev, bij het starten en daarna dagelijks.
      LANGFLOW_MODELS_DEV_REFRESH: "false"
      # Het startscript weigert LANGCHAIN_*, LANGSMITH_*, LANGFUSE_*, LANGWATCH_*,
      # ARIZE_*, OPIK_*, PHOENIX_*, TRACELOOP_*, OPENLAYER_*, OTEL_EXPORTER_OTLP_*,
      # ANTHROPIC_*, CLAUDE_* en LANGFLOW_FEATURE_*.
      SIGNAAL_MODELREGISTER: /app/flows-git/config/modelregister.yaml
      SIGNAAL_COMPONENTENLIJST: /app/flows-git/config/langflow-componenten.yaml
      SIGNAAL_FLOWS_MAP: /app/flows-git/services/langflow/flows
    volumes:
      - langflow_data:/app/data
      # Dezelfde kloon van HEAD als het flowregister van de fork (F2-04, F2-10),
      # met ook het modelregister, de componentenlijst en de eigen componenten.
      - ${SIGNAAL_FLOWS_KLOON:?start via scripts/signaalsysteem/start.sh}:/app/flows-git:ro
      - bronarchief:/bronarchief                        # langflow schrijft de originelen (F2-14)
      # Zelfde koppelpunten als in open-notebook, zodat een pad in beide gelijk is.
      - ${SIGNAAL_INNAMEMAP:?zet SIGNAAL_INNAMEMAP in .env}:/inname:ro
      - ${SIGNAAL_WATCHFOLDER:?zet SIGNAAL_WATCHFOLDER in .env}:/watchfolder:ro
      # Geen vault-koppeling (B8; F5-05).
    # Alleen-lezen (review F2-12, punt 8): schrijven alleen in /app/data,
    # /bronarchief en /tmp.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,urllib.request; os.stat('/tmp/signaal-flows-geladen'); sys.exit(urllib.request.urlopen('http://127.0.0.1:7860/health_check', timeout=5).status != 200)"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s
    mem_limit: 3g
    restart: unless-stopped

  editor-toegang:                 # alleen 127.0.0.1 (ADR 0017, 0022 A); gehard als werkbak-toegang
    build:
      context: services/proxy
      args: { CONF: editor.conf }
    image: signaal/editor-toegang:1.29.3
    networks: [editor-intern, toegang]
    ports:
      - "127.0.0.1:${SIGNAAL_EDITOR_POORT:-8530}:8080"
    depends_on:
      langflow: { condition: service_started }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "101:101"
    restart: unless-stopped

  # ---------------------------------------------------------------- GPU (F2-11)
  # ADR 0009: llama-swap start en stopt docling-serve via deze proxy, met
  # configuratie B (P7): alleen start en stop; create, exec, inspect en de
  # containerlijst geven 403. De socket hangt alleen hier, op het netwerk beheer.
  # `:ro` beperkt de API niet; de regels van de proxy doen dat.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    networks: [beheer]
    # EVENTS en VERSION staan standaard aan; de Docker-client heeft voor start
    # en stop alleen _ping nodig (review F2-11).
    environment:
      POST: "1"
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      CONTAINERS: "0"
      EVENTS: "0"
      VERSION: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs: [/run, /tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Werkmodel, embeddingmodel en docling-serve achter één adres:
  # http://llama-swap:8080 (ADR 0006). Groepen zwaar en licht in
  # services/llama-swap/config.yaml (in het image).
  llama-swap:
    build:
      context: services/llama-swap
    image: signaal/llama-swap:v268-cuda13-b11977-dockercli
    networks: [verwerking, beheer]
    depends_on:
      socket-proxy: { condition: service_started }
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      # Omweg zolang de driver CUDA 13.3 levert (ADR 0006; vervalt in F2-25):
      # de eis cuda>=13.4 uit, en de libcuda van de driver vóór de compat-libcuda.
      NVIDIA_DISABLE_REQUIRE: "1"
      LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu:/usr/local/cuda/lib64
    volumes:
      - modellen:/modellen:ro
    # /root voor de configuratiemap van de Docker-client.
    read_only: true
    tmpfs: [/tmp, /root]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Vooraf aangemaakt door start.sh (`--profile door-llama-swap create`), gestart
  # en gestopt door llama-swap; daarom geen restart. Stoppen is de enige manier
  # om het videogeheugen vrij te geven (P5, ADR 0014).
  docling-serve:
    image: quay.io/docling-project/docling-serve-cu128:v1.38.2@sha256:f26a8dea114dfcfdebcd1617a9eb0a66f48351ff8b5140510d3bfc989c74c38d
    container_name: signaal-docling
    profiles: [door-llama-swap]
    networks: [verwerking]
    secrets: [docling_api_key]
    environment:
      DOCLING_SERVE_ARTIFACTS_PATH: /artifacts
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "false"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "false"
      DOCLING_SERVE_OPTIONS_CACHE_SIZE: "1"
      # Synchroon eindpunt /v1/convert/file (ADR 0009, 0014); voorstel B21.
      DOCLING_SERVE_MAX_SYNC_WAIT: "3600"
      HF_HUB_OFFLINE: "1"
    # De sleutel komt uit het geheim; zonder sleutel start de dienst niet.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        read -r DOCLING_SERVE_API_KEY < /run/secrets/docling_api_key || true;
        [ -n "$$DOCLING_SERVE_API_KEY" ] || { echo 'geen sleutel in /run/secrets/docling_api_key' >&2; exit 1; };
        export DOCLING_SERVE_API_KEY;
        exec docling-serve run --host 0.0.0.0 --port 5001
    volumes:
      - docling_artifacts:/artifacts:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: "no"
