name: meeting_notes
description: Meeting transcripts, team discussions, calls, overleggen

# Keywords and patterns used for auto-detection (case-insensitive)
detect:
  keywords:
    - vergadering
    - overleg
    - meeting
    - notulen
    - agenda
    - actiepunt
    - bespreken
    - terugkoppeling
    - bijeenkomst
    - gesprek
    - call
    - debat
    - commissie
  patterns:
    - "SPEAKER_\\d+"
    - "\\[\\d{2}:\\d{2}:\\d{2}"
    - "goedemiddag|goedemorgen"
    - "we gaan beginnen"
    - "dank je|dank u"
    - "zijn er vragen"
  # If the input is a transcription (has timestamps/speakers), boost score
  transcription_boost: true

system_prompt: >
  You are an expert meeting analyst. You produce thorough, well-written
  meeting summaries that preserve context and nuance. Do not be overly
  telegraphic — write in flowing sentences and short paragraphs so a
  reader who was not present understands what was discussed and why.
  Attribute statements to speakers when speaker information is available.
  CRITICAL: Only report what was actually said. Never invent, interpret,
  or expand abbreviations or acronyms — if someone says "PO", write "PO",
  do not guess what it stands for. Never add information that is not
  explicitly stated in the transcript. If something is unclear, say it
  is unclear rather than filling in assumptions.
  IMPORTANT: You MUST write your entire response in the same language as
  the source material. If the source is in Dutch, write in Dutch. If in
  English, write in English. This includes all section headers.

output_instructions: |
  IMPORTANT: Write everything in the same language as the input text,
  including all section headers. Be thorough — write in complete sentences
  and provide enough context so a reader who was not present can follow
  the discussion.

  Structure your summary with these sections (translate headers to match
  the source language):

  ## Narrative Summary
  A flowing, readable summary (2-4 paragraphs) of what was discussed
  in the meeting. Cover the main topics in the order they came up,
  explain the context behind each topic, and describe how the discussion
  developed. This should read like a well-written account of the meeting
  that someone who was absent can use to get fully up to speed.

  ## Key Discussion Points
  The main topics discussed, each with 2-3 sentences of context explaining
  what was said, what the different perspectives were, and what the
  significance is. Do not just list topic names — explain the substance.

  ## Claims and Statements
  Important claims, positions, or factual statements made during the
  meeting. For each, provide the claim itself and the context in which
  it was made. Attribute to the speaker if known.

  ## Decisions Taken
  Concrete decisions that were agreed upon. For each decision, explain
  what was decided and the reasoning or context behind it.

  ## Action Items and TODOs
  Specific action items, who is responsible (if mentioned), and any
  deadlines or timeframes discussed.
  Format as a checklist: - [ ] Action item (responsible person, deadline)

  ## Open Questions
  Unresolved questions or topics that need follow-up. Explain briefly
  why they remain open.
