[project]
name = "open-notebook"
version = "2.0.0"
description = "Knowledge management system with modular RAG pipelines"
authors = [
    {name = "Luis Novo", email = "lfnovo@gmail.com"}
]
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11,<3.13"

# Root package has minimal dependencies - most live in workspace packages
dependencies = [
    "pydantic>=2.9.2",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5",
    "ruff>=0.5.5",
    "mypy>=1.11.1",
    "types-requests>=2.32.0.20241016",
    "ipywidgets>=8.1.5",
    "pre-commit>=4.0.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ============================================================================
# UV Workspace Configuration
# ============================================================================

[tool.uv.workspace]
members = [
    "packages/*",
    "pipelines/*",
    "apps/*",
]

[tool.uv.sources]
# Workspace packages (auto-resolved)
shared = { workspace = true }
surrealdb-service = { workspace = true }
file-manager = { workspace = true }
llm-manager = { workspace = true }
ingestion = { workspace = true }
ontology-extraction = { workspace = true }
summarization = { workspace = true }
enrichment = { workspace = true }
embeddings = { workspace = true }
retrieval = { workspace = true }
web-scraper = { workspace = true }
app-main = { workspace = true }
chat = { workspace = true }
canvas = { workspace = true }

# External local dependencies
content-core = { path = "../../../repos/public/content-core", editable = true }

# ============================================================================
# Tool Configuration
# ============================================================================

[tool.hatch.build.targets.wheel]
packages = ["open_notebook"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",  # line too long
    "E402",  # module level import not at top of file (Streamlit requires this pattern)
    "E722",  # do not use bare except (legacy code pattern)
    "F401",  # imported but unused (may be used in type hints or re-exports)
    "F541",  # f-string without placeholders
    "F841",  # local variable assigned but never used
]

[tool.ruff.lint.per-file-ignores]
# Streamlit files need nest_asyncio.apply() before imports
"**/ui.py" = ["E402"]
"pages/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "pages.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
